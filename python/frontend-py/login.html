<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HiBiz - Sign In</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="appHelper.js"></script>
    <script src="appHeader.js"></script>
    <style>
      .icon-row {
        display: flex;
        justify-content: space-around;
        margin-top: 32px;
        padding-top: 24px;
        border-top: 1px solid var(--border-light-soft);
      }
      .action-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-sub);
        transition: color 0.2s;
      }
      .action-btn:hover {
        color: var(--primary-color);
      }
      .icon-circle {
        width: 48px;
        height: 48px;
        border-radius: 24px;
        background: var(--bg-light);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 8px;
        border: 1px solid var(--border-light-soft);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .action-btn:hover .icon-circle {
        transform: translateY(-2px);
        box-shadow: var(--shadow-sm);
        border-color: var(--primary-border);
      }
      .icon-label {
        font-size: 13px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <!-- Optional: App Header container if renderAppHeader is called -->
    <div id="app-header-container"></div>

    <div class="login-wrapper">
      <div class="login-bg-decor"></div>

      <div class="login-card">
        <div class="auth-logo-container">
          <!-- Mock Logo placeholder (In real app, this would be an image) -->
          <i class="fa-solid fa-cube fa-2x" style="color: var(--primary-color);"></i>
        </div>

        <h1 class="login-title">Sign In</h1>
        <div class="login-subtitle">Welcome back to HiBiz Enterprise</div>

        <form id="loginForm">
          <div class="form-group">
            <label class="form-label" for="mobileInput">Mobile Number</label>
            <div class="form-input-wrapper">
              <i class="fa-solid fa-phone"></i>
              <input
                type="tel"
                id="mobileInput"
                placeholder="Mobile Number"
                maxlength="10"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" id="passwordLabel" for="passwordInput">Password</label>
            <div class="form-input-wrapper">
              <i id="passwordIcon" class="fa-solid fa-lock"></i>
              <input
                type="password"
                id="passwordInput"
                placeholder="Password"
                required
              />
            </div>
          </div>

          <div class="form-group" style="margin-top: 32px">
            <button type="submit" class="btn btn-primary">
              <span>Sign In</span> <i class="fa-solid fa-arrow-right"></i>
            </button>
          </div>
        </form>

        <div class="icon-row">
          <button class="action-btn" type="button" onclick="alert('Navigate to Forgot Password')">
            <div class="icon-circle">
              <i class="fa-solid fa-key" style="color: #10b981"></i>
            </div>
            <span class="icon-label">Forgot</span>
          </button>

          <button class="action-btn" type="button" onclick="alert('Navigate to Sign Up')">
            <div class="icon-circle">
              <i class="fa-solid fa-user-plus" style="color: #3b82f6"></i>
            </div>
            <span class="icon-label">New User</span>
          </button>

          <button class="action-btn" type="button" onclick="alert('Exit App')">
            <div class="icon-circle">
              <i class="fa-solid fa-arrow-right-from-bracket" style="color: #ef4444"></i>
            </div>
            <span class="icon-label" style="color: #ef4444">Exit</span>
          </button>
        </div>
      </div>
    </div>

    <script>
      const mobileInput = document.getElementById('mobileInput');
      const passwordLabel = document.getElementById('passwordLabel');
      const passwordInput = document.getElementById('passwordInput');
      const passwordIcon = document.getElementById('passwordIcon');
      
      mobileInput.addEventListener('input', function (e) {
        // Guest logic removed
      });

      // Render simple header for login
      document.addEventListener('DOMContentLoaded', () => {
        if (window.renderAppHeader) {
          window.renderAppHeader({ showUserMenu: false });
        }
      });

      // Clipboard functionality removed

      document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const mobile = mobileInput.value;
        const password = passwordInput.value;

        if (mobile.length === 10) {
          const btn = document.querySelector('.btn-primary');
          const originalBtnHtml = btn.innerHTML;
          btn.innerHTML =
            '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Authenticating...</span>';

          btn.disabled = true;

          window.appHelper
            .request('auth/login', {
              method: 'POST',
              body: JSON.stringify({ mobile: mobile, password: password }),
            })
            .then((response) => {
              console.log('Backend Response:\n', response);
              proceedWithLogin(response);
            })
            .catch((err) => {
              console.error('Backend Error:\n', err);
              resetButton(err.message || 'Login failed');
            });

          // Helper to handle successful login steps
          function proceedWithLogin(response) {
            const payload = response?.userSession || response?.data?.userSession || response?.user || response?.data?.user || {};
            const token = response?.token || payload?.token || response?.data?.token || '';
            const role = payload?.userRole || response?.userRole || response?.role || payload?.role || 'corpAdmin';
            const session = {
              ...payload,
              token,
              userRole: role,
              userDisplayName: payload?.userDisplayName || payload?.userName || payload?.name || 'User',
              corporateName: payload?.corporateName || 'HiBiz Main Hub',
              corporatePAN: payload?.corporatePAN || '',
            };

            if (token) localStorage.setItem('hibiz_token', token);
            localStorage.setItem('hibiz_user_role', role);
            localStorage.setItem('hibiz_session', JSON.stringify(session));

            if (window.appHelper && window.appHelper.showToast) {
              window.appHelper.showToast('Login successful!', 'Success');
            }
            setTimeout(() => {
              const normalizedRole = String(role).toLowerCase();
              if (normalizedRole.includes('admin') || role === 'corpAdmin' || role === 'userAdmin') {
                window.location.href = 'adminDashboard.html';
              } else {
                window.location.href = 'projectDashboard.html';
              }
            }, 800);
          }

          // Helper to handle failed login steps
          function resetButton(msg) {
            btn.disabled = false;
            if (window.appHelper && window.appHelper.showToast) {
              window.appHelper.showToast(msg, 'Error');
            }
            btn.innerHTML = originalBtnHtml;
          }
        } else {
          if (window.appHelper && window.appHelper.showToast) {
            window.appHelper.showToast('Invalid Mobile Number', 'Error');
          }
        }
      });
    </script>
  </body>
</html>
