<div class="modal-header">
  <h3 class="modal-title"><i class="fa-solid fa-rotate" style="color: var(--primary-color); margin-right: 8px;"></i> Process Salary</h3>
  <div style="display: flex; gap: 10px; align-items: center;">
    <button class="btn btn-glass" onclick="printProcessVoucherAction()" id="printSalaryBtn" style="padding: 6px 12px; font-size: 12px; display: none;">
      <i class="fa-solid fa-print"></i> Print Voucher
    </button>
    <button class="modal-close" onclick="closeModal('ProcessModal')"><i class="fa-solid fa-xmark"></i></button>
  </div>
</div>
<div class="modal-body" style="display: flex; flex-direction: column; gap: 1rem; max-height: 70vh; overflow-y: auto; padding: 0;">
  <!-- Month Selector & Actions -->
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: var(--surface-color-light); position: sticky; top: 0; z-index: 10;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <button class="btn btn-glass" onclick="changeProcessMonth(-1)" style="padding: 4px 8px;"><i class="fa-solid fa-chevron-left"></i></button>
      <div id="processMonthDisplay" style="font-weight: 700; min-width: 120px; text-align: center;">...</div>
      <button class="btn btn-glass" onclick="changeProcessMonth(1)" style="padding: 4px 8px;"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
    <button class="btn btn-primary" onclick="shareProcessPdf()" id="sharePdfBtn" style="padding: 6px 12px; font-size: 12px;">
      <i class="fa-solid fa-share-nodes"></i> Share PDF
    </button>
  </div>

  <!-- Search Box -->
  <div style="padding: 0 1rem;">
    <div class="form-group" style="margin: 0;">
      <div style="position: relative;">
        <i class="fa-solid fa-search" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-secondary);"></i>
        <input type="text" id="processSearchInput" class="form-input" style="padding-left: 2.5rem;" placeholder="Search employee or EFN..." oninput="renderProcessList()" />
      </div>
    </div>
  </div>

  <!-- Loading State -->
  <div id="processLoading" style="padding: 2rem; text-align: center; display: none;">
    <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color: var(--primary-color);"></i>
    <p style="margin-top: 10px; color: var(--text-secondary);">Loading records...</p>
  </div>

  <!-- Empty State -->
  <div id="processEmpty" style="padding: 2rem; text-align: center; display: none;">
    <i class="fa-solid fa-document-text fa-3x" style="color: var(--text-secondary); opacity: 0.5;"></i>
    <p style="margin-top: 10px; color: var(--text-secondary); font-weight: bold;">No records found.</p>
  </div>

  <!-- Data List -->
  <div id="processListContainer" style="padding: 0 1rem 1rem 1rem; display: flex; flex-direction: column; gap: 0.5rem;">
    <!-- Rendered dynamically -->
  </div>
</div>

<script>
(function() {
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  
  let state = {
    selectedMonth: new Date().getMonth(),
    selectedYear: new Date().getFullYear(),
    loading: false,
    employees: [],
    logs: [],
    leads: [],
    groupedData: [],
    expandedEmployees: {},
    advances: {},
    searchQuery: '',
    token: localStorage.getItem('nex_token') || '' // Fallback if token is needed
  };

  const UI = {
    monthDisplay: document.getElementById('processMonthDisplay'),
    searchInput: document.getElementById('processSearchInput'),
    loading: document.getElementById('processLoading'),
    empty: document.getElementById('processEmpty'),
    listContainer: document.getElementById('processListContainer'),
    printBtn: document.getElementById('printSalaryBtn')
  };

  window.changeProcessMonth = (delta) => {
    let m = state.selectedMonth + delta;
    if (m > 11) {
      state.selectedMonth = 0;
      state.selectedYear++;
    } else if (m < 0) {
      state.selectedMonth = 11;
      state.selectedYear--;
    } else {
      state.selectedMonth = m;
    }
    updateMonthDisplay();
    fetchProcessData();
  };

  window.renderProcessList = () => {
    state.searchQuery = UI.searchInput.value.toLowerCase();
    
    let filteredData = state.groupedData;
    if (state.searchQuery.trim()) {
      filteredData = state.groupedData.filter(emp => 
        (emp.name && emp.name.toLowerCase().includes(state.searchQuery)) ||
        (emp.efn && emp.efn.toLowerCase().includes(state.searchQuery))
      );
    }

    if (filteredData.length === 0 && !state.loading) {
      UI.empty.style.display = 'block';
      UI.listContainer.style.display = 'none';
    } else {
      UI.empty.style.display = 'none';
      UI.listContainer.style.display = 'flex';
      
      let html = '';
      filteredData.forEach((emp, index) => {
        const isExpanded = !!state.expandedEmployees[emp.empId];
        const advanceVal = state.advances[emp.empId] || '';
        
        let sitesHtml = '';
        if (isExpanded) {
          sitesHtml = \`<div style="background: var(--surface-color-light); padding: 8px 12px; border-top: 1px solid rgba(255,255,255,0.05);">\`;
          emp.sites.forEach(site => {
            sitesHtml += \`
              <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05);">
                <div>
                  <div style="font-size: 13px; font-weight: 600;">\${site.siteName}</div>
                  <div style="font-size: 11px; color: var(--text-secondary);">Shift: \${site.shiftCode}</div>
                </div>
                <div style="text-align: right;">
                  <div style="font-size: 13px; font-weight: bold; color: var(--primary-color);">₹\${Math.round(site.earning).toLocaleString()}</div>
                  <div style="font-size: 11px; color: var(--text-secondary);">\${site.pCount} P × ₹\${site.salaryRate}</div>
                </div>
              </div>
            \`;
          });
          sitesHtml += \`</div>\`;
        }
        
        let initial = (emp.name || 'W').substring(0,2).toUpperCase();
        
        html += \`
          <div style="background: var(--surface-color); border: 1px solid var(--surface-color-light); border-radius: 8px; overflow: hidden;">
            <div style="display: flex; align-items: center; padding: 12px; cursor: pointer; \${isExpanded ? 'background: rgba(0,0,0,0.2);' : ''}" onclick="toggleProcessEmployee('\${emp.empId}')">
              <div style="width: 40px; height: 40px; border-radius: 20px; background: rgba(16, 185, 129, 0.1); color: var(--primary-color); display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 12px;">
                \${emp.photo ? \`<img src="\${emp.photo}" style="width:100%;height:100%;border-radius:20px;object-fit:cover;" />\` : initial}
              </div>
              <div style="flex: 1;">
                <div style="font-weight: 700; font-size: 14px;">\${index + 1}. \${emp.name}</div>
                <div style="font-size: 12px; color: var(--text-secondary); margin-top: 2px;">
                  \${emp.efn ? \`EFN: \${emp.efn} | \` : ''}Dues: ₹\${Math.round(emp.totalDues).toLocaleString()}
                </div>
              </div>
              \${isExpanded ? \`
                <input type="number" placeholder="Adv." class="form-input" style="width: 70px; padding: 4px 8px; height: auto; margin-right: 10px; font-size: 12px;" 
                  value="\${advanceVal}" onclick="event.stopPropagation()" oninput="updateProcessAdvance('\${emp.empId}', this.value)" />
              \` : ''}
              <i class="fa-solid fa-chevron-\${isExpanded ? 'up' : 'down'}" style="color: var(--text-secondary);"></i>
            </div>
            \${sitesHtml}
          </div>
        \`;
      });
      UI.listContainer.innerHTML = html;
    }
    
    const expandedIds = Object.keys(state.expandedEmployees).filter(k => state.expandedEmployees[k]);
    if (expandedIds.length === 1) {
      UI.printBtn.style.display = 'block';
      window.printProcessVoucherAction = () => printProcessVoucher(expandedIds[0]);
    } else {
      UI.printBtn.style.display = 'none';
    }
  };

  window.toggleProcessEmployee = (empId) => {
    state.expandedEmployees[empId] = !state.expandedEmployees[empId];
    window.renderProcessList();
  };

  window.updateProcessAdvance = (empId, val) => {
    state.advances[empId] = val;
  };

  const updateMonthDisplay = () => {
    if (UI.monthDisplay) UI.monthDisplay.innerText = \`\${MONTHS[state.selectedMonth]} \${state.selectedYear}\`;
  };

  const computeGroupedData = () => {
    const daysInMonth = new Date(state.selectedYear, state.selectedMonth + 1, 0).getDate();
    const empMap = new Map();

    state.logs.forEach(log => {
      if (log.isPaid) return;
      
      let rawEmpId = '';
      if (log.employeeId && typeof log.employeeId === 'object') {
        rawEmpId = String(log.employeeId._id || log.employeeId.id || '');
      } else {
        rawEmpId = String(log.employeeId || '');
      }
      if (!rawEmpId || rawEmpId === '[object Object]') return;

      const empObj = typeof log.employeeId === 'object' ? log.employeeId : { _id: rawEmpId };
      const fullEmp = state.employees.find(e => String(e._id || e.id) === rawEmpId);
      const role = String(fullEmp?.role || empObj.role || log.role || '').toLowerCase();
      
      if (role === 'corpadmin' || role === 'useradmin') return;

      const name = fullEmp?.name || empObj.name || log.markedByUserName || 'Worker';
      const efn = fullEmp?.enrollment_no || empObj.enrollment_no || '';
      const photo = fullEmp?.photo_url || fullEmp?.photo || fullEmp?.userProfileImage || fullEmp?.employeeImage || empObj?.photo_url || empObj?.photo || empObj?.userProfileImage || empObj?.employeeImage || '';

      if (!empMap.has(rawEmpId)) {
        empMap.set(rawEmpId, { empId: rawEmpId, name, efn, photo, sites: new Map() });
      }

      const empRecord = empMap.get(rawEmpId);
      const siteId = String(log.leadId?._id || log.leadId || 'hq_remote');
      const siteName = log.site_name || log.leadId?.sender_name || 'HQ / Remote';
      const shiftCode = log.shiftCode || 'G';
      const siteKey = \`\${siteId}_\${shiftCode}\`;

      if (!empRecord.sites.has(siteKey)) {
        empRecord.sites.set(siteKey, {
          siteId, siteName, shiftCode, logs: [], logIds: []
        });
      }

      const siteData = empRecord.sites.get(siteKey);
      siteData.logs.push(log);
      siteData.logIds.push(log._id);
    });

    const result = [];
    empMap.forEach(empData => {
      const displaySites = [];
      let totalDues = 0;

      empData.sites.forEach(siteData => {
        let pCount = 0;
        const presentDays = new Set();
        
        siteData.logs.forEach(l => {
          const hrs = Number(l.hoursWorked) || 0;
          const notAbsent = l.status !== 'Absent' && l.status !== 'Leave';
          if (notAbsent && hrs >= 4) {
            const dateStr = l.date || l.dutyStart;
            if (dateStr) {
              const day = new Date(dateStr).getDate();
              if (!isNaN(day)) presentDays.add(day);
            }
          }
        });
        pCount = presentDays.size;

        const lead = state.leads.find(l => String(l._id || l.id) === siteData.siteId);
        let salaryRate = 0;
        if (lead && lead.siteShifts && Array.isArray(lead.siteShifts)) {
          const shiftDetail = lead.siteShifts.find(s => s.shiftCode === siteData.shiftCode);
          if (shiftDetail) {
            salaryRate = Number(shiftDetail.salaryRate) || 0;
          }
        }
        
        const earning = (pCount * salaryRate) / daysInMonth;
        
        displaySites.push({
          siteId: siteData.siteId,
          siteName: siteData.siteName,
          shiftCode: siteData.shiftCode,
          pCount,
          salaryRate,
          earning
        });

        totalDues += earning;
      });

      if (displaySites.length > 0) {
        displaySites.sort((a,b) => a.siteName.localeCompare(b.siteName));
        result.push({
          empId: empData.empId,
          name: empData.name,
          efn: empData.efn,
          photo: empData.photo,
          totalDues,
          sites: displaySites
        });
      }
    });

    result.sort((a,b) => a.name.localeCompare(b.name));
    state.groupedData = result;
  };

  const fetchProcessData = async () => {
    state.loading = true;
    UI.loading.style.display = 'block';
    UI.empty.style.display = 'none';
    UI.listContainer.style.display = 'none';
    state.expandedEmployees = {};

    try {
      const startOfMonth = new Date(state.selectedYear, state.selectedMonth, 1, 0, 0, 0, 0);
      const endOfMonth = new Date(state.selectedYear, state.selectedMonth + 1, 0, 23, 59, 59, 999);
      
      const headers = { 'Authorization': \`Bearer \${state.token}\`, 'Content-Type': 'application/json' };
        const apiBase = window.appHelper ? window.appHelper.getBaseUrl() : 'http://127.0.0.1:5000';

      const [empRes, attRes, leadsRes] = await Promise.all([
        fetch(\`\${apiBase}/service/hr/employees?all=true\`, { headers }).then(r => r.json()).catch(() => ({ data: [] })),
        fetch(\`\${apiBase}/service/hr/attendance?from_date=\${startOfMonth.toISOString()}&to_date=\${endOfMonth.toISOString()}\`, { headers }).then(r => r.json()).catch(() => ({ data: [] })),
        fetch(\`\${apiBase}/service/leads/list\`, { headers }).then(r => r.json()).catch(() => ({ data: { data: [] } }))
      ]);

      state.employees = Array.isArray(empRes.data?.data) ? empRes.data.data : (Array.isArray(empRes.data) ? empRes.data : []);
      
      if (attRes.success) {
        state.logs = attRes.data || [];
      } else if (Array.isArray(attRes.data)) {
        state.logs = attRes.data;
      } else {
        state.logs = [];
      }

      state.leads = Array.isArray(leadsRes.data?.data) ? leadsRes.data.data : (Array.isArray(leadsRes.data) ? leadsRes.data : []);

      computeGroupedData();
    } catch (e) {
      console.warn('Failed to fetch process data', e);
    } finally {
      state.loading = false;
      UI.loading.style.display = 'none';
      window.renderProcessList();
    }
  };

  window.shareProcessPdf = () => {
    if (state.groupedData.length === 0) {
      alert('No data to share.');
      return;
    }
    
    let rowsHtml = '';
    state.groupedData.forEach((emp, index) => {
      if (emp.sites.length > 1) {
        emp.sites.forEach((site, si) => {
          if (si === 0) {
            rowsHtml += \`<tr><td rowspan="\${emp.sites.length}">\${index + 1}</td><td rowspan="\${emp.sites.length}">\${emp.name}</td><td rowspan="\${emp.sites.length}">\${emp.efn}</td><td>\${site.siteName}</td><td>\${site.pCount}</td><td>₹\${site.salaryRate}</td><td rowspan="\${emp.sites.length}">₹\${Math.round(emp.totalDues).toLocaleString()}</td></tr>\`;
          } else {
            rowsHtml += \`<tr><td>\${site.siteName}</td><td>\${site.pCount}</td><td>₹\${site.salaryRate}</td></tr>\`;
          }
        });
      } else {
        const site = emp.sites[0];
        rowsHtml += \`<tr><td>\${index + 1}</td><td>\${emp.name}</td><td>\${emp.efn}</td><td>\${site ? site.siteName : ''}</td><td>\${site ? site.pCount : 0}</td><td>₹\${site ? site.salaryRate : 0}</td><td>₹\${Math.round(emp.totalDues).toLocaleString()}</td></tr>\`;
      }
    });
    
    const html = \`
      <html>
        <head>
          <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
          <style>
            body { font-family: Helvetica, Arial, sans-serif; padding: 20px; }
            table { width: 100%; border-collapse: collapse; margin-top: 20px; }
            th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
            th { background-color: #f2f2f2; }
          </style>
        </head>
        <body>
          <h2>Processed Salary - \${MONTHS[state.selectedMonth]} \${state.selectedYear}</h2>
          <table>
            <thead><tr><th>Sr</th><th>Name</th><th>EFN</th><th>Site Name</th><th>Days Present</th><th>Pay Rate</th><th>Compound Dues</th></tr></thead>
            <tbody>\${rowsHtml}</tbody>
          </table>
        </body>
      </html>
    \`;
    
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    iframe.contentDocument.write(html);
    iframe.contentDocument.close();
    iframe.contentWindow.focus();
    iframe.contentWindow.print();
    setTimeout(() => document.body.removeChild(iframe), 1000);
  };

  const printProcessVoucher = async (workerId) => {
    const worker = state.groupedData.find(w => w.empId === workerId);
    if (!worker) return;

    const advanceVal = parseFloat(state.advances[workerId]) || 0;
    const totalDues = worker.totalDues;
    const netPayable = totalDues - advanceVal;

    let rowsHtml = '';
    worker.sites.forEach(site => {
      rowsHtml += \`<tr><td>\${site.siteName}</td><td>\${site.shiftCode}</td><td style="text-align:center">\${site.pCount}</td><td style="text-align:right">Rs. \${site.salaryRate}</td><td style="text-align:right">Rs. \${Math.round(site.earning).toLocaleString()}</td></tr>\`;
    });

    const html = \`
      <html>
        <head>
          <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
          <style>
            @page { size: A4 portrait; margin: 5mm; }
            body { font-family: Helvetica, Arial, sans-serif; padding: 0; margin: 0; font-size: 14px; box-sizing: border-box; }
            .page-container { height: 143.5mm; width: 100%; box-sizing: border-box; padding: 5px; }
            .voucher-box { border: 2px solid #000; padding: 15px; width: 100%; height: 100%; box-sizing: border-box; position: relative; }
            .header { text-align: center; font-size: 20px; font-weight: bold; margin-bottom: 15px; text-decoration: underline; }
            .row { display: flex; justify-content: space-between; margin-bottom: 8px; }
            .label { font-weight: bold; }
            .table { width: 100%; border-collapse: collapse; margin-top: 10px; }
            .table th, .table td { border: 1px solid #000; padding: 6px; text-align: left; font-size: 13px; }
            .table th { background-color: #f2f2f2; }
            .signatures { display: flex; justify-content: space-between; position: absolute; bottom: 15px; left: 15px; right: 15px; }
            .sign-line { border-top: 1px solid #000; width: 150px; text-align: center; padding-top: 5px; font-size: 13px; }
          </style>
        </head>
        <body>
          <div class="page-container">
            <div class="voucher-box">
              <div class="header">PAYMENT VOUCHER</div>
              <div class="row">
                <div><span class="label">Date:</span> \${new Date().toLocaleDateString()}</div>
                <div><span class="label">Voucher No:</span> ________</div>
              </div>
              <table class="table">
                <thead><tr><th>Particulars</th><th style="text-align:right">Debit (Rs.)</th><th style="text-align:right">Credit (Rs.)</th></tr></thead>
                <tbody>
                  <tr><td><strong>\${worker.name} A/c</strong><br/><small><em>(Salary Due)</em></small></td><td style="text-align:right">\${Math.round(totalDues).toLocaleString()}</td><td style="text-align:right"></td></tr>
                  <tr><td>To <strong>Advance A/c</strong><br/><small><em>(Advance Deduction)</em></small></td><td style="text-align:right"></td><td style="text-align:right">\${Math.round(advanceVal).toLocaleString()}</td></tr>
                  <tr><td>To <strong>Petty Cash Book</strong><br/><small><em>(Net Payable)</em></small></td><td style="text-align:right"></td><td style="text-align:right">\${Math.round(netPayable).toLocaleString()}</td></tr>
                </tbody>
                <tfoot><tr><th style="text-align:right">Total</th><th style="text-align:right">\${Math.round(totalDues).toLocaleString()}</th><th style="text-align:right">\${Math.round(totalDues).toLocaleString()}</th></tr></tfoot>
              </table>
              <div style="margin-top: 20px;"><span class="label">Narration:</span> Cash paid towards salary for the month of \${MONTHS[state.selectedMonth]} \${state.selectedYear}.</div>
              <table class="table" style="margin-top: 30px;">
                <thead><tr><th>Site / Project</th><th>Shift</th><th style="text-align:center">Days Present</th><th style="text-align:right">Rate</th><th style="text-align:right">Amount</th></tr></thead>
                <tbody>\${rowsHtml}</tbody>
              </table>
              <div class="signatures">
                <div class="sign-line">Prepared By</div>
                <div class="sign-line">Authorized Signatory</div>
                <div class="sign-line">Receiver's Signature</div>
              </div>
            </div>
          </div>
        </body>
      </html>
    \`;
    
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    iframe.contentDocument.write(html);
    iframe.contentDocument.close();
    iframe.contentWindow.focus();
    iframe.contentWindow.print();
    setTimeout(() => document.body.removeChild(iframe), 1000);

    const allLogIds = worker.sites.flatMap(s => s.logIds || []);
    if (allLogIds.length > 0) {
      try {
          const apiBase = window.appHelper ? window.appHelper.getBaseUrl() : 'http://127.0.0.1:5000';
        await fetch(\`\${apiBase}/service/hr/attendance/mark-paid\`, {
          method: 'POST',
          headers: { 'Authorization': \`Bearer \${state.token}\`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ logIds: allLogIds })
        });
        fetchProcessData();
      } catch (e) {
        console.warn('Failed to mark as paid', e);
      }
    }
  };

  updateMonthDisplay();

  const originalOpenModal = window.openModal;
  if (originalOpenModal) {
    window.openModal = function(id) {
      originalOpenModal(id);
      if (id === 'ProcessModal') {
        fetchProcessData();
      }
    };
  } else {
    setTimeout(fetchProcessData, 500);
  }
})();
</script>
