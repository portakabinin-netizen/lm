<div class="modal-header">
  <h3 class="modal-title"><i class="fa-solid fa-receipt" style="color: var(--primary-color); margin-right: 8px;"></i> Bill Collection</h3>
  <button class="modal-close" onclick="closeModal('BillCollectionModal')"><i class="fa-solid fa-xmark"></i></button>
</div>
<div class="modal-body" style="padding: 1rem; max-height: 75vh; overflow-y: auto;">
  
  <div id="bcLoading" style="text-align: center; display: none;">
    <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color: var(--primary-color);"></i>
    <p style="margin-top: 10px; color: var(--text-secondary);">Loading Ledgers...</p>
  </div>

  <div id="bcForm" style="display: none;">
    <div class="form-group" style="margin-bottom: 1rem;">
      <label class="form-label">Client Name (Sundry Debtor)</label>
      <select class="form-select" id="bcClientSelect">
        <option value="">Select Client...</option>
      </select>
    </div>
    
    <div class="form-group" style="margin-bottom: 1rem;">
      <label class="form-label">Debit Account (Cash/Bank)</label>
      <select class="form-select" id="bcBankSelect">
        <option value="">Select Account...</option>
      </select>
    </div>

    <div class="form-group" style="margin-bottom: 1rem;">
      <label class="form-label">Amount Collected</label>
      <div style="position: relative;">
        <span style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-secondary);">₹</span>
        <input type="number" id="bcAmount" class="form-input" style="padding-left: 2rem;" placeholder="0.00" />
      </div>
    </div>

    <div class="form-group" style="margin-bottom: 1rem;">
      <label class="form-label">Narration (Optional)</label>
      <textarea id="bcNarration" class="form-input" rows="3" placeholder="Enter details like Cheque No, Ref ID..."></textarea>
    </div>
  </div>

</div>
<div class="modal-footer">
  <button class="btn btn-glass" onclick="closeModal('BillCollectionModal')">Cancel</button>
  <button class="btn btn-primary" onclick="bcSubmitReceipt()"><i class="fa-solid fa-save" style="margin-right: 6px;"></i> Save Receipt</button>
</div>

<script>
(function() {
  window.bcState = {
    token: localStorage.getItem('nex_token') || '',
    ledgers: [],
    clients: [],
    banks: []
  };

  const UI = {
    loading: document.getElementById('bcLoading'),
    form: document.getElementById('bcForm'),
    clientSelect: document.getElementById('bcClientSelect'),
    bankSelect: document.getElementById('bcBankSelect'),
    amount: document.getElementById('bcAmount'),
    narration: document.getElementById('bcNarration')
  };

  const getUrl = (path) => window.appHelper.getUrl(path);

  async function fetchBCData() {
    if (!window.bcState.token) return;
    
    UI.loading.style.display = 'block';
    UI.form.style.display = 'none';

    try {
      const headers = { 'Authorization': `Bearer ${window.bcState.token}`, 'Content-Type': 'application/json' };
      const masterRes = await fetch(getUrl('finance/master'), { headers });

      if (masterRes.ok) {
        const masterJson = await masterRes.json();
        if (masterJson.data && masterJson.data.ledgers) {
          window.bcState.ledgers = masterJson.data.ledgers;
          
          window.bcState.clients = window.bcState.ledgers.filter(l => 
            (l.groupId && l.groupId.name === 'Sundry Debtors') || l.refType === 'Client'
          );
          
          window.bcState.banks = window.bcState.ledgers.filter(l => 
            (l.groupId && (l.groupId.name === 'Bank Accounts' || l.groupId.name === 'Cash-in-hand')) || 
            (l.name && (l.name.toLowerCase().includes('cash') || l.name.toLowerCase().includes('bank')))
          );
        }
      }
    } catch (e) {
      console.error(e);
    } finally {
      UI.loading.style.display = 'none';
      UI.form.style.display = 'block';
      populateBCSelects();
    }
  }

  function populateBCSelects() {
    let clientHtml = '<option value="">Select Client...</option>';
    window.bcState.clients.forEach(c => {
      let balText = c.currentBalance ? ` (Bal: ₹${Math.abs(c.currentBalance)} ${c.currentBalance > 0 ? 'Dr' : 'Cr'})` : '';
      clientHtml += `<option value="${c._id}">${c.name}${balText}</option>`;
    });
    UI.clientSelect.innerHTML = clientHtml;

    let bankHtml = '<option value="">Select Account...</option>';
    window.bcState.banks.forEach(b => {
      let balText = b.currentBalance ? ` (Bal: ₹${Math.abs(b.currentBalance)})` : '';
      bankHtml += `<option value="${b._id}">${b.name}${balText}</option>`;
    });
    UI.bankSelect.innerHTML = bankHtml;
  }

  window.bcSubmitReceipt = async () => {
    const clientId = UI.clientSelect.value;
    const bankId = UI.bankSelect.value;
    const amt = parseFloat(UI.amount.value);
    const narration = UI.narration.value || 'Bill Collection Receipt';

    if (!clientId) return alert("Select a Client (Sundry Debtor)");
    if (!bankId) return alert("Select a Debit Account (Cash/Bank)");
    if (!amt || amt <= 0) return alert("Enter a valid amount collected");

    const payload = {
      type: 'Receipt',
      subType: 'bill_collection',
      date: new Date().toISOString().split('T')[0],
      narration: narration,
      entries: [
        { ledgerId: bankId, type: 'Dr', amount: amt },
        { ledgerId: clientId, type: 'Cr', amount: amt }
      ]
    };

    try {
      const headers = { 'Authorization': `Bearer ${window.bcState.token}`, 'Content-Type': 'application/json' };
      const res = await fetch(getUrl('finance/vouchers'), {
        method: 'POST',
        headers,
        body: JSON.stringify(payload)
      });
      
      if (res.ok) {
        alert("Receipt Saved Successfully!");
        closeModal('BillCollectionModal');
      } else {
        const err = await res.json();
        alert(`Error: ${err.message || 'Failed to save receipt'}`);
      }
    } catch (e) {
      console.error(e);
      alert("Network error processing receipt.");
    }
  };

  window.addEventListener('BillCollectionModal_opened', () => {
    fetchBCData();
  }, { once: false });

})();
</script>
