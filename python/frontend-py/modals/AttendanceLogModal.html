<div class="modal-header">
  <h3 class="modal-title"><i class="fa-solid fa-pen-to-square" style="color: var(--primary-color); margin-right: 8px;"></i> Modify Attendance Log</h3>
  <button class="modal-close" onclick="closeModal('DynamicModal')"><i class="fa-solid fa-xmark"></i></button>
</div>
<div class="modal-body">
  <div class="form-group" style="margin-bottom: 1rem;">
    <label class="form-label">Search Staff</label>
    <div style="position: relative;">
      <i class="fa-solid fa-search" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-secondary);"></i>
      <input type="text" class="form-input" style="padding-left: 2.5rem;" placeholder="Search by name or EFN..." />
    </div>
  </div>
  
  <div class="form-group" style="margin-bottom: 1rem;">
    <label class="form-label">Select Date</label>
    <input type="date" class="form-input" value="2026-07-05" />
  </div>

  <h4 style="margin-top: 1.5rem; margin-bottom: 1rem;">Log Records</h4>
  <div style="background: var(--surface-color-light); padding: 1rem; border-radius: 8px; margin-bottom: 0.5rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <div style="font-weight: 600;">John Doe</div>
      <span style="background: rgba(16, 185, 129, 0.2); color: #10b981; padding: 2px 8px; border-radius: 12px; font-size: 11px;">Present</span>
    </div>
    <div style="font-size: 12px; color: var(--text-secondary);">In: 09:05 AM - Out: 18:00 PM</div>
    <div style="margin-top: 10px; display: flex; gap: 10px;">
      <button class="btn btn-glass" style="padding: 0.25rem 0.5rem; font-size: 12px;">Edit Time</button>
      <button class="btn btn-glass" style="padding: 0.25rem 0.5rem; font-size: 12px; color: #ef4444;">Delete Log</button>
    </div>
  </div>
</div>
<div class="modal-footer">
  <button class="btn btn-glass" onclick="closeModal('DynamicModal')">Close</button>
</div>
