<div class="modal-header">
  <h3 class="modal-title"><i class="fa-solid fa-calculator" style="color: var(--primary-color); margin-right: 8px;"></i> Salary Register</h3>
  <button class="modal-close" onclick="closeModal('SalaryRegisterModal')"><i class="fa-solid fa-xmark"></i></button>
</div>
<div class="modal-body" style="overflow-x: auto; padding: 1rem; max-height: 70vh;">
  <div style="display: flex; gap: 10px; margin-bottom: 1rem; align-items: flex-end;">
    <div style="flex: 1;">
      <label class="form-label">Month</label>
      <input type="month" id="srMonthInput" class="form-input" onchange="window.srState.monthYear = this.value; fetchSRData()" />
    </div>
    <div style="flex: 2;">
      <label class="form-label">Site</label>
      <select class="form-select" id="srSiteSelect" onchange="window.srState.selectedSite = this.value; renderSRTable()">
        <option value="all">All Sites</option>
      </select>
    </div>
    <div>
      <button class="btn btn-primary" onclick="exportSRExcel()"><i class="fa-solid fa-file-excel"></i> Export CSV</button>
    </div>
  </div>

  <div id="srLoading" style="text-align: center; display: none; margin: 2rem 0;">
    <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color: var(--primary-color);"></i>
    <p style="margin-top: 10px; color: var(--text-secondary);">Loading Register...</p>
  </div>

  <table style="width: 100%; min-width: 800px; border-collapse: collapse; font-size: 12px; margin-top: 1rem;" id="srTable">
    <thead>
      <tr style="background: var(--surface-color-light); text-align: left;">
        <th style="padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.1);">Staff Name</th>
        <th style="padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.1);">Site</th>
        <th style="padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.1);">Days (P)</th>
        <th style="padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.1);">Rate</th>
        <th style="padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.1);">Gross</th>
        <th style="padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.1);">Status</th>
      </tr>
    </thead>
    <tbody id="srTableBody">
      <!-- Rendered dynamically -->
    </tbody>
  </table>
</div>
<div class="modal-footer">
  <button class="btn btn-glass" onclick="closeModal('SalaryRegisterModal')">Close</button>
</div>

<script>
(function() {
  const d = new Date();
  const ym = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  
  window.srState = {
    monthYear: ym,
    selectedSite: 'all',
    token: localStorage.getItem('nex_token') || '',
    logs: [],
    leads: [],
    groupedData: []
  };

  const UI = {
    monthInput: document.getElementById('srMonthInput'),
    siteSelect: document.getElementById('srSiteSelect'),
    tbody: document.getElementById('srTableBody'),
    loading: document.getElementById('srLoading'),
    table: document.getElementById('srTable')
  };

  UI.monthInput.value = window.srState.monthYear;

  const getUrl = (path) => window.appHelper.getUrl(path);

  async function fetchSRData() {
    if (!window.srState.token) return;
    
    UI.loading.style.display = 'block';
    UI.table.style.display = 'none';

    try {
      const headers = { 'Authorization': \`Bearer \${window.srState.token}\`, 'Content-Type': 'application/json' };
      
      const [year, month] = window.srState.monthYear.split('-');
      const fromDate = \`\${year}-\${month}-01\`;
      const toDate = new Date(year, month, 0).toISOString().split('T')[0];
      
      const [logRes, leadRes] = await Promise.all([
        fetch(getUrl(\`service/hr/attendance?from_date=\${fromDate}&to_date=\${toDate}&limit=2000\`), { headers }),
        fetch(getUrl('service/leads/list?limit=100'), { headers })
      ]);

      if (logRes.ok) {
        const logJson = await logRes.json();
        window.srState.logs = logJson.data || [];
      }
      if (leadRes.ok) {
        const leadJson = await leadRes.json();
        window.srState.leads = leadJson.data || [];
        populateSRSites();
      }
      computeSRGroupedData();
    } catch (e) {
      console.error(e);
    } finally {
      UI.loading.style.display = 'none';
      UI.table.style.display = 'table';
      window.renderSRTable();
    }
  }

  function populateSRSites() {
    let html = '<option value="all">All Sites</option>';
    window.srState.leads.forEach(lead => {
      const name = lead.sender_name || lead.product_name || lead.email || 'Unknown';
      html += \`<option value="\${lead._id}">\${name}</option>\`;
    });
    UI.siteSelect.innerHTML = html;
    UI.siteSelect.value = window.srState.selectedSite;
  }

  function computeSRGroupedData() {
    const empMap = new Map();
    window.srState.logs.forEach(log => {
      let rawEmpId = log.employeeId && typeof log.employeeId === 'object' ? log.employeeId._id : log.employeeId;
      if (!rawEmpId) return;

      const empName = (typeof log.employeeId === 'object' ? log.employeeId.name : log.employeeName) || 'Unknown';
      const siteId = log.leadId && typeof log.leadId === 'object' ? log.leadId._id : log.leadId;
      const siteName = log.site_name || 'Unknown Site';
      const rate = log.rate || 0;
      
      const key = rawEmpId + '_' + siteId;
      
      if (!empMap.has(key)) {
        empMap.set(key, {
          empId: rawEmpId,
          empName: empName,
          siteId: siteId,
          siteName: siteName,
          days: 0,
          rate: rate,
          gross: 0,
          isPaid: !!log.isPaid
        });
      }
      
      const entry = empMap.get(key);
      if (log.status === 'Present') {
        let weight = log.shiftCode === 'D' || log.shiftCode === 'N' || log.shiftCode === 'G' ? 1 : 0.5;
        entry.days += weight;
        entry.gross += (rate * weight);
      }
    });

    window.srState.groupedData = Array.from(empMap.values());
  }

  window.renderSRTable = () => {
    let html = '';
    const filtered = window.srState.selectedSite === 'all' 
      ? window.srState.groupedData 
      : window.srState.groupedData.filter(d => d.siteId === window.srState.selectedSite);

    if (filtered.length === 0) {
      html = \`<tr><td colspan="6" style="text-align:center; padding: 20px;">No salary data for selected criteria</td></tr>\`;
    } else {
      filtered.forEach(row => {
        html += \`
          <tr>
            <td style="padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05);">\${row.empName}</td>
            <td style="padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05);">\${row.siteName}</td>
            <td style="padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05);">\${row.days}</td>
            <td style="padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05);">₹\${row.rate}</td>
            <td style="padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05);">₹\${Math.round(row.gross).toLocaleString()}</td>
            <td style="padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05);">
              <span style="background: \${row.isPaid ? 'rgba(16, 185, 129, 0.2)' : 'rgba(239, 68, 68, 0.2)'}; 
                           color: \${row.isPaid ? '#10b981' : '#ef4444'}; padding: 2px 6px; border-radius: 4px;">
                \${row.isPaid ? 'Paid' : 'Unpaid'}
              </span>
            </td>
          </tr>
        \`;
      });
    }
    UI.tbody.innerHTML = html;
  };

  window.exportSRExcel = () => {
    const rows = [["Staff Name", "Site", "Days (P)", "Rate", "Gross", "Status"]];
    const filtered = window.srState.selectedSite === 'all' 
      ? window.srState.groupedData 
      : window.srState.groupedData.filter(d => d.siteId === window.srState.selectedSite);

    filtered.forEach(r => {
      rows.push([r.empName, r.siteName, r.days, r.rate, Math.round(r.gross), r.isPaid ? 'Paid' : 'Unpaid']);
    });
    
    let csvContent = "data:text/csv;charset=utf-8," 
      + rows.map(e => e.join(",")).join("\\n");
      
    var encodedUri = encodeURI(csvContent);
    var link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", \`salary_register_\${window.srState.monthYear}.csv\`);
    document.body.appendChild(link);
    link.click();
    link.remove();
  };

  window.addEventListener('SalaryRegisterModal_opened', () => {
    fetchSRData();
  }, { once: false });

})();
</script>
