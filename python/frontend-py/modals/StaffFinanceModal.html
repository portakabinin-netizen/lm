<div class="modal-header">
  <h3 class="modal-title"><i class="fa-solid fa-wallet" style="color: var(--primary-color); margin-right: 8px;"></i> Staff Finance / Advance</h3>
  <button class="modal-close" onclick="closeModal('StaffFinanceModal')"><i class="fa-solid fa-xmark"></i></button>
</div>
<div class="modal-body" style="padding: 1rem; max-height: 75vh; overflow-y: auto;">
  
  <div id="sfStaffSelection">
    <div class="form-group" style="margin-bottom: 1rem;">
      <label class="form-label">Search Staff</label>
      <div style="position: relative;">
        <i class="fa-solid fa-search" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-secondary);"></i>
        <input type="text" id="sfSearchInput" class="form-input" style="padding-left: 2.5rem;" placeholder="Name or EFN..." oninput="window.sfState.searchQuery = this.value.toLowerCase(); renderSFStaffList()" />
      </div>
    </div>

    <div id="sfLoading" style="text-align: center; display: none;">
      <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color: var(--primary-color);"></i>
      <p style="margin-top: 10px; color: var(--text-secondary);">Loading Staff & Balances...</p>
    </div>

    <div id="sfStaffList" style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem;">
      <!-- Dynamic list -->
    </div>
  </div>

  <div id="sfPaymentSection" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <button class="btn btn-glass" onclick="sfSelectStaff(null)" style="padding: 4px 8px;"><i class="fa-solid fa-chevron-left"></i> Back</button>
      <div id="sfSelectedStaffName" style="font-weight: bold; font-size: 16px;">Staff Name</div>
    </div>

    <div style="background: var(--surface-color-light); padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; text-align: center;">
      <p style="margin: 0; font-size: 12px; color: var(--text-secondary);">Current Balance</p>
      <h2 id="sfStaffBalance" style="margin: 5px 0 0 0; color: #ef4444;">₹0</h2>
      <p style="margin: 0; font-size: 11px; color: var(--text-secondary);">(Advance Pending / Payable)</p>
    </div>

    <div class="form-group" style="margin-bottom: 1rem;">
      <label class="form-label">Transaction Type</label>
      <select class="form-select" id="sfPayType">
        <option value="advance">Give Advance (Cash Payment)</option>
        <option value="penalty">Impose Penalty (Journal)</option>
        <option value="article">Article Issued (Journal)</option>
      </select>
    </div>

    <div class="form-group" style="margin-bottom: 1rem;">
      <label class="form-label">Amount</label>
      <div style="position: relative;">
        <span style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-secondary);">₹</span>
        <input type="number" id="sfAmount" class="form-input" style="padding-left: 2rem;" placeholder="0.00" />
      </div>
    </div>

    <div class="form-group" style="margin-bottom: 1rem;">
      <label class="form-label">Narration / Remarks</label>
      <textarea id="sfNarration" class="form-input" rows="2" placeholder="Optional details..."></textarea>
    </div>
    
    <button class="btn btn-primary" onclick="sfSubmitTransaction()" style="width: 100%;"><i class="fa-solid fa-check"></i> Process Transaction</button>
  </div>

</div>

<script>
(function() {
  window.sfState = {
    token: localStorage.getItem('nex_token') || '',
    employees: [],
    ledgers: [],
    searchQuery: '',
    selectedStaff: null
  };

  const UI = {
    loading: document.getElementById('sfLoading'),
    staffList: document.getElementById('sfStaffList'),
    selectionDiv: document.getElementById('sfStaffSelection'),
    paymentDiv: document.getElementById('sfPaymentSection'),
    staffName: document.getElementById('sfSelectedStaffName'),
    staffBalance: document.getElementById('sfStaffBalance'),
    amount: document.getElementById('sfAmount'),
    payType: document.getElementById('sfPayType'),
    narration: document.getElementById('sfNarration')
  };

  const getUrl = (path) => window.appHelper.getUrl(path);

  async function fetchSFData() {
    if (!window.sfState.token) return;
    
    UI.loading.style.display = 'block';
    UI.staffList.style.display = 'none';

    try {
      const headers = { 'Authorization': `Bearer ${window.sfState.token}`, 'Content-Type': 'application/json' };
      
      const [empRes, masterRes] = await Promise.all([
        fetch(getUrl('service/hr/employees?limit=200'), { headers }),
        fetch(getUrl('finance/master'), { headers })
      ]);

      if (empRes.ok) {
        const empJson = await empRes.json();
        window.sfState.employees = empJson.data || [];
      }
      if (masterRes.ok) {
        const masterJson = await masterRes.json();
        if (masterJson.data && masterJson.data.ledgers) {
          window.sfState.ledgers = masterJson.data.ledgers;
        }
      }

      // Map balances
      window.sfState.employees.forEach(emp => {
        const ledger = window.sfState.ledgers.find(l => l.refType === 'Staff' && l.refId === emp._id);
        emp.balance = ledger ? (ledger.currentBalance || ledger.openingBalance || 0) : 0;
        emp.ledgerId = ledger ? ledger._id : null;
      });

    } catch (e) {
      console.error(e);
    } finally {
      UI.loading.style.display = 'none';
      UI.staffList.style.display = 'flex';
      window.renderSFStaffList();
    }
  }

  window.renderSFStaffList = () => {
    let html = '';
    const filtered = window.sfState.employees.filter(emp => 
      (emp.name && emp.name.toLowerCase().includes(window.sfState.searchQuery)) ||
      (emp.enrollment_no && emp.enrollment_no.toLowerCase().includes(window.sfState.searchQuery))
    );

    if (filtered.length === 0) {
      html = `<div style="text-align:center; color: var(--text-secondary); padding: 1rem;">No staff found</div>`;
    } else {
      filtered.forEach(emp => {
        let initial = (emp.name || 'W').substring(0,2).toUpperCase();
        let balColor = emp.balance > 0 ? '#dc2626' : emp.balance < 0 ? '#16a34a' : 'var(--text-dark)';
        let balText = emp.balance > 0 ? `₹${emp.balance} Dr` : emp.balance < 0 ? `₹${Math.abs(emp.balance)} Cr` : '₹0';
        
        html += `
          <div style="background: var(--surface-color); border: 1px solid var(--surface-color-light); border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;" onclick="sfSelectStaff('${emp._id}')">
            <div style="display: flex; align-items: center; gap: 12px;">
              <div style="width: 40px; height: 40px; border-radius: 20px; background: rgba(16, 185, 129, 0.1); color: var(--primary-color); display: flex; align-items: center; justify-content: center; font-weight: bold;">
                ${initial}
              </div>
              <div>
                <div style="font-weight: 600;">${emp.name}</div>
                <div style="font-size: 11px; color: var(--text-secondary);">${emp.role || 'Staff'} | Bal: <span style="color: ${balColor}; font-weight: bold;">${balText}</span></div>
              </div>
            </div>
            <i class="fa-solid fa-chevron-right" style="color: var(--text-secondary);"></i>
          </div>
        `;
      });
    }
    UI.staffList.innerHTML = html;
  };

  window.sfSelectStaff = (empId) => {
    if (!empId) {
      window.sfState.selectedStaff = null;
      UI.selectionDiv.style.display = 'block';
      UI.paymentDiv.style.display = 'none';
      return;
    }
    
    const emp = window.sfState.employees.find(e => e._id === empId);
    if (!emp) return;
    
    if (!emp.ledgerId) {
      alert("This staff has no ledger account created yet. Sync required.");
      return;
    }

    window.sfState.selectedStaff = emp;
    UI.staffName.innerText = emp.name;
    
    let balColor = emp.balance > 0 ? '#dc2626' : emp.balance < 0 ? '#16a34a' : 'var(--text-dark)';
    let balText = emp.balance > 0 ? `₹${emp.balance} Dr` : emp.balance < 0 ? `₹${Math.abs(emp.balance)} Cr` : '₹0';
    
    UI.staffBalance.innerText = balText;
    UI.staffBalance.style.color = balColor;
    
    UI.amount.value = '';
    UI.narration.value = '';
    
    UI.selectionDiv.style.display = 'none';
    UI.paymentDiv.style.display = 'block';
  };

  window.sfSubmitTransaction = async () => {
    const emp = window.sfState.selectedStaff;
    if (!emp) return;
    
    const amt = parseFloat(UI.amount.value);
    if (!amt || amt <= 0) {
      alert("Enter a valid amount.");
      return;
    }

    const type = UI.payType.value;
    const narration = UI.narration.value || type;
    
    let cashLedger = window.sfState.ledgers.find(l => l.name === 'Cash Book' || (l.groupId && l.groupId.name === 'Cash-in-hand'));
    let penaltyLedger = window.sfState.ledgers.find(l => l.name.toLowerCase().includes('penalty'));
    let articleLedger = window.sfState.ledgers.find(l => l.name.toLowerCase().includes('article') || l.name.toLowerCase().includes('uniform'));
    
    let payload = {
      type: type === 'advance' ? 'Payment' : 'Journal',
      date: new Date().toISOString().split('T')[0],
      narration: narration,
      subType: type === 'advance' ? 'salary' : 'journal',
      entries: []
    };

    if (type === 'advance') {
      if (!cashLedger) return alert("Cash ledger not found in master.");
      payload.entries.push({ ledgerId: cashLedger._id, type: 'Cr', amount: amt });
      payload.entries.push({ ledgerId: emp.ledgerId, type: 'Dr', amount: amt });
    } else if (type === 'penalty') {
      if (!penaltyLedger) return alert("Penalty ledger not found in master.");
      payload.entries.push({ ledgerId: penaltyLedger._id, type: 'Cr', amount: amt });
      payload.entries.push({ ledgerId: emp.ledgerId, type: 'Dr', amount: amt });
    } else if (type === 'article') {
      if (!articleLedger) return alert("Article ledger not found in master.");
      payload.entries.push({ ledgerId: articleLedger._id, type: 'Cr', amount: amt });
      payload.entries.push({ ledgerId: emp.ledgerId, type: 'Dr', amount: amt });
    }

    try {
      const headers = { 'Authorization': `Bearer ${window.sfState.token}`, 'Content-Type': 'application/json' };
      const res = await fetch(getUrl('finance/vouchers'), {
        method: 'POST',
        headers,
        body: JSON.stringify(payload)
      });
      
      if (res.ok) {
        alert("Transaction successful!");
        emp.balance += amt; // update locally
        window.sfSelectStaff(null);
        window.renderSFStaffList();
      } else {
        const err = await res.json();
        alert(`Error: ${err.message || 'Transaction failed'}`);
      }
    } catch (e) {
      console.error(e);
      alert("Network error processing transaction.");
    }
  };

  window.addEventListener('StaffFinanceModal_opened', () => {
    fetchSFData();
  }, { once: false });

})();
</script>
