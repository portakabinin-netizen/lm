<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sitewise Attendance Register - HiBiz Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #16a34a;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f8fafc;
      color: var(--text-main);
      padding: 24px;
    }
    .report-card {
      max-width: 1400px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.07);
    }
    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 18px;
      margin-bottom: 20px;
    }
    .company-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-main);
    }
    .report-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      background: #f8fafc;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: #e2e8f0; color: var(--text-main); }
    .filter-select {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
    }
    table.report-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11.5px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
    }
    table.report-table th, table.report-table td {
      border: 1px solid #cbd5e1;
      padding: 5px 6px;
      vertical-align: middle;
    }
    table.report-table th {
      background: #f1f5f9;
      font-weight: 700;
      color: #334155;
      text-transform: uppercase;
      font-size: 11px;
      text-align: center;
      border: 1px solid #cbd5e1;
    }
    .emp-row-end td {
      border-bottom: 2px solid #64748b !important;
    }
    .day-cell { text-align: center; width: 25px; min-width: 25px; font-weight: 700; font-size: 11px; padding: 2px !important; border: 1px solid #cbd5e1 !important; }
    .col-p-th { background: #f0fdf4 !important; color: #166534 !important; }
    .col-l-th { background: #fffbeb !important; color: #b45309 !important; }
    .col-a-th { background: #fef2f2 !important; color: #b91c1c !important; }
    .col-h-th { background: #faf5ff !important; color: #6b21a8 !important; }
    .col-p-cell { background: #f0fdf4; font-weight: 800; color: #16a34a; text-align: center; border: 1px solid #cbd5e1 !important; }
    .col-l-cell { background: #fffbeb; font-weight: 800; color: #d97706; text-align: center; border: 1px solid #cbd5e1 !important; }
    .col-a-cell { background: #fef2f2; font-weight: 800; color: #dc2626; text-align: center; border: 1px solid #cbd5e1 !important; }
    .col-h-cell { background: #faf5ff; font-weight: 800; color: #7e22ce; text-align: center; border: 1px solid #cbd5e1 !important; }
    .p-tag { color: #16a34a; font-weight: 800; }
    .a-tag { color: #dc2626; font-weight: 800; }
    .l-tag { color: #d97706; font-weight: 800; }
    .h-tag { color: #7e22ce; font-weight: 800; }
    .dd-tag { color: #2563eb; font-weight: 800; }
    .signature-row {
      display: flex;
      justify-content: space-between;
      margin-top: 60px;
      padding-top: 14px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
    }
    @page {
      size: A4 landscape;
      margin: 8mm 6mm;
    }
    @media print {
      body { background: #fff; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-size: 8.5px; }
      .controls-bar, .no-print { display: none !important; }
      .report-card { border: none; box-shadow: none; padding: 0; max-width: 100%; width: 100%; }
      table.report-table { font-size: 8px; width: 100%; }
      table.report-table th, table.report-table td { padding: 2.5px 2px; }
      .day-cell { width: 18px; min-width: 18px; font-size: 7.5px; }
    }
  </style>
</head>
<body>

  <div class="report-card">
    <div class="report-header">
      <div>
        <h1 class="company-title" id="companyNameDisplay">HiBiz Operations</h1>
        <p class="report-subtitle">Monthly Sitewise Attendance Register (Form Muster Roll)</p>
      </div>
      <div style="text-align:right;">
        <div style="font-size:16px; font-weight:800; color:var(--primary);" id="periodDisplay">Month Year</div>
        <div style="font-size:12px; color:var(--text-muted);" id="siteDisplay">Site: All Active Projects</div>
      </div>
    </div>

    <div class="controls-bar no-print">
      <div style="display:flex; align-items:center; gap:10px;">
        <label style="font-size:13px; font-weight:700;">Month:</label>
        <input type="month" id="monthInput" class="filter-select" onchange="onPeriodChange()">
        <label style="font-size:13px; font-weight:700; margin-left:10px;">Site:</label>
        <select id="siteSelect" class="filter-select" onchange="renderAttendance()"></select>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-secondary" onclick="window.close()"><i class="fa-solid fa-arrow-left"></i> Back</button>
        <button class="btn btn-primary" onclick="window.print()"><i class="fa-solid fa-print"></i> Print Register</button>
      </div>
    </div>

    <div id="loading" style="text-align:center; padding:40px; color:#94a3b8;">
      <i class="fa-solid fa-spinner fa-spin" style="font-size:24px; margin-bottom:8px;"></i>
      <div>Loading attendance report...</div>
    </div>

    <div style="overflow-x:auto;">
      <table class="report-table" id="reportTable" style="display:none;">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="signature-row">
      <div>Timekeeper / Site Supervisor</div>
      <div>Project Manager</div>
      <div>HR / Accounts Verification</div>
    </div>
  </div>

  <script>
    const API_BASE = 'https://hipk.onrender.com/api';
    const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

    // Session from query param or localStorage
    const urlParams = new URLSearchParams(window.location.search);
    const sessionUser = JSON.parse(localStorage.getItem('sessionUser') || 'null') || {};
    const token = urlParams.get('token') || sessionUser.token || '';
    const dbName = urlParams.get('dbName') || sessionUser.selectedDbName || '';
    const corpName = sessionUser.selectedCorporateName || 'Our Company';

    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();
    let rawLogs = [];
    let allEmployees = [];
    let allLeads = [];

    document.getElementById('companyNameDisplay').textContent = corpName;
    document.getElementById('monthInput').value = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;

    async function apiGet(endpoint) {
      const res = await fetch(`${API_BASE}/${endpoint.replace(/^\//, '')}`, {
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
          ...(dbName ? { 'x-tenant-id': dbName } : {})
        }
      });
      return await res.json();
    }

    async function init() {
      if (!token) {
        alert('Authentication required. Please sign in via index.html first.');
        return;
      }
      try {
        const [leadsRes] = await Promise.all([
          apiGet('service/leads/list').catch(() => ({ data: [] }))
        ]);
        allLeads = leadsRes.data || [];
        const siteSel = document.getElementById('siteSelect');
        siteSel.innerHTML = '<option value="__all__">All Sites</option>';
        allLeads.forEach(l => {
          const opt = document.createElement('option');
          opt.value = l._id;
          opt.textContent = l.sender_name || l.displayName || 'Site';
          siteSel.appendChild(opt);
        });

        await loadData();
      } catch (err) {
        console.error(err);
      }
    }

    async function loadData() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('reportTable').style.display = 'none';

      const start = new Date(currentYear, currentMonth, 1).toISOString();
      const end = new Date(currentYear, currentMonth + 1, 0, 23, 59, 59).toISOString();
      document.getElementById('periodDisplay').textContent = `${MONTH_NAMES[currentMonth]} ${currentYear}`;

      try {
        const [attRes, empRes] = await Promise.all([
          apiGet(`service/hr/attendance?from_date=${start}&to_date=${end}`),
          apiGet('service/hr/employees?all=true')
        ]);
        rawLogs = attRes.data || [];
        allEmployees = empRes.data || [];
        renderAttendance();
      } catch (e) {
        alert('Failed to load report data: ' + e.message);
      } finally {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('reportTable').style.display = 'table';
      }
    }

    function onPeriodChange() {
      const val = document.getElementById('monthInput').value;
      if (val) {
        const parts = val.split('-');
        currentYear = parseInt(parts[0]);
        currentMonth = parseInt(parts[1]) - 1;
        loadData();
      }
    }

    function isCorpAdminOrAdmin(role) {
      if (!role) return false;
      const r = String(role).toLowerCase().trim();
      return r === 'corpadmin' || r === 'admin' || r === 'corporateadmin' || r === 'useradmin';
    }

    function isHdStatus(status) {
      const s = String(status || '').toLowerCase().trim();
      return s === 'hd' || s === 'half day' || s === 'halfday' || s === 'holiday';
    }

    function isAbsentStatus(status) {
      const s = String(status || '').toLowerCase().trim();
      return s === 'absent' || s === 'a';
    }

    function isLeaveStatus(status) {
      const s = String(status || '').toLowerCase().trim();
      return s === 'leave' || s === 'l';
    }

    function computeEmpBaseMonthlyRate(emp, daysInMonth) {
      if (!emp) return 0;
      const ae = (emp.employmentHistory || []).find(e => e.active) || (emp.employmentHistory || []).slice(-1)[0] || null;
      const m = Number(ae?.monthly_rate || emp.monthly_rate || emp.monthlyRate || 0);
      if (m >= 1000) return m;

      const r = Number(ae?.rate || emp.rate || 0);
      if (r >= 1000) return r;

      const d = Number(ae?.daily_rate || emp.daily_rate || emp.dailyRate || 0);
      if (d >= 1000) return d;

      if (d >= 100 && d < 1000) return Math.round(d * daysInMonth);
      if (r >= 100 && r < 1000) return Math.round(r * daysInMonth);

      if (m > 0) return m;
      if (r >= 100) return r;
      if (d >= 100) return d;
      return r || d || 0;
    }

    function resolveSiteMonthlyRate(emp, sId, siteLogs, defaultMRate, daysInMonth, leadsList) {
      if (leadsList && sId) {
        const lead = leadsList.find(ld => String(ld._id || ld.id || '') === String(sId));
        if (lead && Array.isArray(lead.siteShifts) && lead.siteShifts.length > 0) {
          let logShift = '';
          for (const l of (siteLogs || [])) {
            if (l.shiftCode || l.shift_code) { logShift = l.shiftCode || l.shift_code; break; }
          }
          if (logShift) {
            const shiftDetail = lead.siteShifts.find(s => s.shiftCode === logShift);
            const sr = Number(shiftDetail?.salaryRate || 0);
            if (sr >= 1000) return sr;
            if (sr >= 100 && sr < 1000) return Math.round(sr * daysInMonth);
          }
          const firstShiftRate = Number(lead.siteShifts[0]?.salaryRate || 0);
          if (firstShiftRate >= 1000) return firstShiftRate;
          if (firstShiftRate >= 100 && firstShiftRate < 1000) return Math.round(firstShiftRate * daysInMonth);
        }
      }

      if (emp && emp.employmentHistory && sId) {
        const siteHist = emp.employmentHistory.find(h => String(h.leadId || h.siteId || '') === String(sId) && h.active)
          || emp.employmentHistory.find(h => String(h.leadId || h.siteId || '') === String(sId));
        if (siteHist) {
          const sm = Number(siteHist.monthly_rate || siteHist.monthlyRate || 0);
          if (sm >= 1000) return sm;
          const sr = Number(siteHist.rate || 0);
          if (sr >= 1000) return sr;
          const sd = Number(siteHist.daily_rate || siteHist.dailyRate || 0);
          if (sd >= 1000) return sd;
          if (sm >= 100) return sm;
          if (sr >= 100 && sr < 1000) return Math.round(sr * daysInMonth);
          if (sd >= 100 && sd < 1000) return Math.round(sd * daysInMonth);
        }
      }

      for (const l of (siteLogs || [])) {
        const lr = Number(l.rate || l.dailyRate || l.daily_rate || 0);
        if (lr >= 1000) return lr;
        if (lr >= 100 && lr < 1000) return Math.round(lr * daysInMonth);
      }

      return defaultMRate;
    }

    function renderAttendance() {
      const siteFilter = document.getElementById('siteSelect').value;
      const siteName = siteFilter === '__all__' ? 'All Sites' : (allLeads.find(l => l._id === siteFilter)?.sender_name || 'Selected Site');
      document.getElementById('siteDisplay').textContent = `Site: ${siteName}`;

      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const thead = document.getElementById('tableHead');
      const tbody = document.getElementById('tableBody');

      let headHtml = `<tr>
        <th style="width:28px;">#</th>
        <th style="width:105px;">Name</th>
        <th style="width:55px;">EFN</th>
        <th style="width:85px;">Site</th>`;
      for (let d = 1; d <= daysInMonth; d++) {
        headHtml += `<th class="day-cell">${d}</th>`;
      }
      headHtml += `
        <th class="col-p-th" style="text-align:center; width:34px;" title="Present">P</th>
        <th class="col-l-th" style="text-align:center; width:34px;" title="Leave">L</th>
        <th class="col-a-th" style="text-align:center; width:34px;" title="Absent">A</th>
        <th class="col-h-th" style="text-align:center; width:34px;" title="Holiday">H</th>
        <th style="width:75px;">Sign</th>
      </tr>`;
      thead.innerHTML = headHtml;

      let bodyHtml = '';
      let renderedCount = 0;

      allEmployees.forEach(emp => {
        if (isCorpAdminOrAdmin(emp.role)) return;

        const empId = String(emp._id || emp.id || '');
        let logs = rawLogs.filter(l => {
          const lId = (l.employeeId && typeof l.employeeId === 'object') ? String(l.employeeId._id || l.employeeId.id) : String(l.employeeId || '');
          return lId === empId;
        });

        if (siteFilter !== '__all__') {
          logs = logs.filter(l => {
            const sId = (l.leadId && typeof l.leadId === 'object') ? String(l.leadId._id) : String(l.leadId || '');
            return sId === siteFilter;
          });
        }

        if (logs.length === 0) return;

        // Group employee logs by site
        const siteGroups = new Map();
        logs.forEach(l => {
          const sId = (l.leadId && typeof l.leadId === 'object') ? String(l.leadId._id) : String(l.leadId || '');
          const lead = allLeads.find(ld => String(ld._id) === sId);
          const sName = lead?.sender_name || lead?.displayName || lead?.product_name || l.site_name || (sId ? 'Site #' + sId.slice(-4) : 'HQ Duty');
          const siteKey = sId || sName;
          if (!siteGroups.has(siteKey)) {
            siteGroups.set(siteKey, { siteId: sId, siteName: sName, logs: [] });
          }
          siteGroups.get(siteKey).logs.push(l);
        });

        const validSiteRows = [];

        siteGroups.forEach(sg => {
          const dayMap = {};
          sg.logs.forEach(l => {
            const d = new Date(l.date || l.dutyStart).getDate();
            if (!dayMap[d]) dayMap[d] = [];
            dayMap[d].push(l);
          });

          let pCount = 0;
          let lCount = 0;
          let aCount = 0;
          let hCount = 0;
          let rowCellsHtml = '';

          for (let d = 1; d <= daysInMonth; d++) {
            const dLogs = dayMap[d] || [];
            if (dLogs.length === 0) {
              // Blank day assumed as Absent (A)
              aCount += 1;
              rowCellsHtml += `<td class="day-cell"><span class="a-tag" style="opacity:0.65;">A</span></td>`;
            } else {
              const l = dLogs[0];
              const isAbsent = isAbsentStatus(l.status);
              const isLeave = isLeaveStatus(l.status);
              const isHd = isHdStatus(l.status);
              const isDouble = !isAbsent && !isLeave && !isHd && dLogs.length > 1;

              let tag = '<span class="p-tag">P</span>';
              if (isAbsent) {
                tag = '<span class="a-tag">A</span>';
                aCount += 1;
              } else if (isLeave) {
                tag = '<span class="l-tag">L</span>';
                lCount += 1;
              } else if (isHd) {
                tag = '<span class="h-tag">H</span>';
                hCount += 1;
              } else if (isDouble) {
                tag = '<span class="dd-tag">PP</span>';
                pCount += 2; // Double duty counts 2 present days
              } else {
                pCount += 1;
              }

              rowCellsHtml += `<td class="day-cell">${tag}</td>`;
            }
          }

          if ((pCount + lCount + hCount) > 0 || sg.logs.length > 0) {
            validSiteRows.push({
              siteName: sg.siteName,
              rowCellsHtml,
              pCount,
              lCount,
              aCount,
              hCount
            });
          }
        });

        if (validSiteRows.length === 0) return;

        renderedCount++;
        const rowSpan = validSiteRows.length;

        validSiteRows.forEach((sr, rIdx) => {
          const isLast = rIdx === rowSpan - 1;
          bodyHtml += `<tr class="${isLast ? 'emp-row-end' : ''}">`;
          if (rIdx === 0) {
            bodyHtml += `
              <td style="color:#94a3b8; vertical-align:middle; text-align:center;" rowspan="${rowSpan}">${renderedCount}</td>
              <td style="font-weight:700; vertical-align:middle;" rowspan="${rowSpan}">${emp.name}</td>
              <td style="color:#64748b; vertical-align:middle; text-align:center;" rowspan="${rowSpan}">${emp.enrollment_no || '-'}</td>`;
          }
          bodyHtml += `
            <td style="font-weight:600; color:#334155;">${sr.siteName}</td>
            ${sr.rowCellsHtml}
            <td class="col-p-cell">${sr.pCount}</td>
            <td class="col-l-cell">${sr.lCount}</td>
            <td class="col-a-cell">${sr.aCount}</td>
            <td class="col-h-cell">${sr.hCount}</td>`;
          if (rIdx === 0) {
            bodyHtml += `<td rowspan="${rowSpan}"></td>`;
          }
          bodyHtml += `</tr>`;
        });
      });

      tbody.innerHTML = bodyHtml || `<tr><td colspan="${daysInMonth + 9}" style="text-align:center; padding:30px; color:#94a3b8;">No active workers with attendance found.</td></tr>`;
    }

    init();
  </script>
</body>
</html>
